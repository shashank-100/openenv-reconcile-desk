name: Publish and test Reconcile Desk
on:
  push:
    branches: [main]
    paths: ["server/**", "upstream/**", "Dockerfile", "requirements.txt", "openenv.yaml", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shashank-100/openenv-reconcile-desk:v1
          labels: |
            org.opencontainers.image.source=https://github.com/shashank-100/openenv-reconcile-desk
            org.opencontainers.image.licenses=MIT,BSD-3-Clause,OGL-UK-3.0
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull the published digest anonymously
        env:
          IMAGE: ghcr.io/shashank-100/openenv-reconcile-desk@${{ steps.build.outputs.digest }}
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --name reconcile-test -d -p 8000:8000 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs reconcile-test
          exit 1
      - name: Pinned validation and unit tests
        run: |
          docker exec reconcile-test openenv validate --url http://localhost:8000
          docker cp tests reconcile-test:/opt/tests
          docker exec reconcile-test chmod 700 /opt/tests
          docker exec reconcile-test pip install pytest
          docker exec -e PYTHONPATH=/app reconcile-test python -m pytest /opt/tests/test_tasks.py -q
      - name: Native reward, isolation and timeout controls
        run: |
          docker exec -e PYTHONPATH=/app reconcile-test python /opt/tests/replay.py http://localhost:8000
          curl -fsS http://localhost:8000/schema > schema-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: schema-live
          path: schema-live.json
